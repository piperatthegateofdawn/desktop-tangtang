name: Build macOS app

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt6
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name "DesktopPet" \
            --add-data "assets:assets" \
            main.py

      - name: Zip .app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/DesktopPet.app" "DesktopPet-mac.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-mac
          path: DesktopPet-mac.zip
